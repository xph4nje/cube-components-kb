title: "Agile Documentation"
description: "Guida operativa a BlastPlan, BlastDev, composizioni, stili e componenti."

url: "https://xph4nje.github.io"
baseurl: ""

# Versione fissata per evitare aggiornamenti non controllati del tema.
remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme

# Tema personalizzato definito in:
# _sass/color_schemes/agile.scss
color_scheme: agile

search_enabled: true
heading_anchors: true
nav_enabled: true

aux_links:
  "Repository GitHub":
    - "https://github.com/xph4nje/xph4nje.github.io"

aux_links_new_tab: true

gh_edit_link: false

sass:
  style: compressed

exclude:
  - README-SETUP.md
